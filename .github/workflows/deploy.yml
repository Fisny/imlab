name: Pubblica I'M LAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v7

      - name: Configura Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Compila il sito
        run: npm run build -- --base=/imlab/

      - name: Configura Pages
        uses: actions/configure-pages@v6

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
